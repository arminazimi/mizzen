# Documentation site for mizzen, read by Mizzen.
title: Mizzen
description: A deterministic docs engine with exact source positions.
lang: en
url: https://arminazimi.github.io
base: /mizzen
repository:
  url: https://github.com/arminazimi/mizzen
  branch: main
  dir: site
theme:
  options:
    logo:
      light: /brand/mark-light.svg
      dark: /brand/mark-dark.svg
    favicon:
      svg: /brand/favicon.svg
      ico: /brand/favicon.ico
      apple: /brand/apple-touch-icon.png
    footer:
      copyright: "© Velella"
      license: "Apache-2.0 license"
      links:
        - title: GitHub
          url: https://github.com/arminazimi/mizzen
        - title: Lateen
          url: https://arminazimi.github.io/lateen/
        - title: Install
          url: /install/
        - title: Accessibility
          url: /accessibility/
# Pages removed from the docs site; their old addresses lead to the home page.
redirects:
